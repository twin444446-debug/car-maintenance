
name: Check restored archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check archive exists
        run: |
          set -e
          if [ ! -f "car-maintenance-migration-fix.zip" ]; then
            echo "::error::Archive car-maintenance-migration-fix.zip not found in repository root"
            exit 1
          fi
          echo "Archive found"

      - name: Validate and extract archive
        run: |
          set -e
          unzip -t car-maintenance-migration-fix.zip
          mkdir -p /tmp/archive-check
          unzip -q car-maintenance-migration-fix.zip -d /tmp/archive-check

      - name: Locate Gradle project
        run: |
          set -e
          SETTINGS=$(find /tmp/archive-check -type f -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found in archive"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"
          test -f "$ROOT/build.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"

      - name: Check source files
        run: |
          set -e
          find "$PROJECT_ROOT/app/src/main/java" -type f -name '*.kt' -print
          COUNT=$(find "$PROJECT_ROOT/app/src/main/java" -type f -name '*.kt' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Kotlin source files found"
            exit 1
          fi
          echo "Kotlin files found: $COUNT"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          gradle --version
          gradle --no-daemon assembleDebug
