      - name: Find project root
        shell: bash
        run: |
          set -e
          ROOT=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -f "$CANDIDATE/build.gradle.kts" ] &&
               [ -f "$CANDIDATE/app/build.gradle.kts" ] &&
               [ -f "$CANDIDATE/app/src/main/AndroidManifest.xml" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$RUNNER_TEMP/restored" \
            -type f -name settings.gradle.kts)

          if [ -z "$ROOT" ]; then
            echo "::error::Project root not found"
            find "$RUNNER_TEMP/restored" -maxdepth 6 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          echo "Project files verified"
