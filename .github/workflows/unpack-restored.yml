name: Restore project from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Unpack restored project
        run: |
          set -e
          mkdir -p /tmp/restored
          unzip -q car-maintenance-restored-logic.zip -d /tmp/restored

          ROOT=$(find /tmp/restored -name settings.gradle.kts -type f \
            -not -path '*/.gradle/*' | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "Could not find settings.gradle.kts in ZIP"
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='car-maintenance-restored-logic.zip' \
            "$ROOT"/ ./

      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project files from prepared ZIP" || echo "No changes to commit"
          git push
